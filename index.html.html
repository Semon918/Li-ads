<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Notice — AI Ad Editor</title>
  <!-- Google Fonts & Tailwind CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          animation: {
            'glow-pulse': 'glow 8s ease-in-out infinite alternate',
          },
          keyframes: {
            glow: {
              '0%': { transform: 'scale(1) translate(0px, 0px)', opacity: '0.4' },
              '100%': { transform: 'scale(1.15) translate(20px, -20px)', opacity: '0.7' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08090d;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: radial-gradient(120% 120% at 50% 0%, rgba(26, 29, 41, 0.75) 0%, rgba(13, 15, 22, 0.85) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 
                  0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4 relative overflow-hidden select-none">

  <!-- Ambient Backdrop Glows -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/15 rounded-full blur-[120px] pointer-events-none animate-glow-pulse"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-[140px] pointer-events-none animate-glow-pulse" style="animation-delay: -4s;"></div>

  <!-- Main Card -->
  <main class="w-full max-w-md relative z-10">
    <div class="glass-card rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden transition-all duration-300">
      
      <!-- Top Accent Line -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-[1px] bg-gradient-to-r from-transparent via-amber-400/50 to-transparent"></div>

      <!-- Live Status Pill -->
      <div class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 mb-7">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
        </span>
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-300">Capacity Reached</span>
      </div>

      <!-- Primary Title -->
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white mb-6">
        We are out of limit for now.
      </h1>

      <!-- Core Messages -->
      <div class="space-y-3 mb-8">
        <p class="text-slate-300 font-medium text-base sm:text-lg leading-relaxed">
          We are working on a new project with AI.
        </p>
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed">
          That one will be costly for us, so it will be paid.
        </p>
      </div>

      <!-- Contact / Discord Action Box -->
      <div class="p-4 rounded-2xl bg-white/[0.03] border border-white/[0.06] hover:border-indigo-500/30 transition-all duration-300">
        <p class="text-xs text-slate-400 font-medium tracking-wide mb-3">
          To get that AI ad editor, contact:
        </p>

        <!-- Discord Handle Button -->
        <button 
          id="copyBtn" 
          onclick="copyUsername()" 
          class="w-full group flex items-center justify-between px-4 py-3 rounded-xl bg-[#5865F2]/10 hover:bg-[#5865F2] border border-[#5865F2]/30 hover:border-[#5865F2] text-slate-200 hover:text-white transition-all duration-200 cursor-pointer"
          title="Click to copy username"
        >
          <div class="flex items-center gap-3">
            <!-- Discord SVG Icon -->
            <svg class="w-5 h-5 text-[#5865F2] group-hover:text-white transition-colors" viewBox="0 0 127.14 96.36" fill="currentColor">
              <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            <span class="font-semibold text-sm tracking-wide">stevenedward23</span>
          </div>

          <div class="flex items-center gap-1.5 text-xs text-slate-400 group-hover:text-white/90">
            <span id="copyText">Copy</span>
            <svg id="copyIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </div>
        </button>
      </div>

    </div>
  </main>

  <script>
    function copyUsername() {
      const username = 'stevenedward23';
      const copyText = document.getElementById('copyText');
      const copyIcon = document.getElementById('copyIcon');

      // Hidden textarea fallback for robust copying within iframes
      const tempInput = document.createElement('textarea');
      tempInput.value = username;
      tempInput.style.position = 'fixed';
      tempInput.style.opacity = '0';
      document.body.appendChild(tempInput);
      tempInput.select();
      
      try {
        document.execCommand('copy');
        copyText.textContent = 'Copied!';
        copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
        
        setTimeout(() => {
          copyText.textContent = 'Copy';
          copyIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>';
        }, 2200);
      } catch (err) {
        console.error('Failed to copy: ', err);
      } finally {
        document.body.removeChild(tempInput);
      }
    }
  </script>
</body>
</html>
